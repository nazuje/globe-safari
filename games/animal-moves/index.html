<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Animal Moves</title>
    <meta
      name="description"
      content="A get-up-and-move game for a 4-year-old and a grown-up: the tablet shows an animal, and everyone hops, stomps and sways along."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐸</text></svg>"
    />
  </head>
  <body>
    <header id="topbar" class="topbar">
      <h1 class="title">Animal Moves</h1>
      <button id="beat-toggle" class="beat-toggle topbar-end" type="button" aria-pressed="true">🥁<span id="beat-icon">🔊</span></button>
    </header>

    <main class="game">
      <section id="menu" class="menu">
        <div class="hero">
          <button id="go" class="go" type="button">Go!</button>
          <span class="finger" aria-hidden="true">👆</span>
          <button id="menu-say" class="round-btn hero-say" type="button" aria-label="Say it again">🔊</button>
        </div>
        <div class="grownups">
          <div id="modes" class="pills pills-modes" role="group" aria-label="Game"></div>
          <p id="mode-hint" class="hint"></p>
          <div class="count-row">
            <span class="hint">Animals</span>
            <div id="counts" class="pills pills-counts" role="group" aria-label="How many animals"></div>
          </div>
        </div>
      </section>

      <section id="stage" class="stage" hidden>
        <ol id="trail" class="trail" aria-hidden="true"></ol>
        <div id="scene" class="scene">
          <div id="actor" class="actor">
            <span id="animal" class="animal"></span>
            <span id="puff" class="puff" aria-hidden="true"></span>
            <span id="question" class="question" aria-hidden="true" hidden>❓</span>
            <span id="notes" class="notes" aria-hidden="true" hidden>🎵</span>
            <span id="number" class="number" hidden></span>
          </div>
          <div id="choices" class="choices" hidden></div>
        </div>
        <div id="bar" class="bar" aria-hidden="true">
          <div id="bar-fill" class="bar-fill"></div>
        </div>
        <div class="words">
          <p id="line" class="line" aria-live="polite"></p>
          <p id="tip" class="hint"></p>
        </div>
        <div class="controls">
          <button id="pause" class="round-btn round-big" type="button" aria-label="Pause">⏸️</button>
          <button id="repeat" class="round-btn round-big" type="button" aria-label="Say it again">🔊</button>
        </div>
      </section>

      <section id="party" class="party" hidden>
        <div class="high-five" aria-hidden="true">🙌</div>
        <h2 class="party-title">High five!</h2>
        <ol id="party-parade" class="party-parade" aria-hidden="true"></ol>
        <div id="party-actions" class="party-actions" hidden>
          <button id="again" class="go go-small" type="button">Go!</button>
          <button id="to-menu" class="small-btn" type="button">Change game</button>
        </div>
      </section>

      <div id="paused" class="paused" hidden>
        <button id="resume" class="round-btn round-huge" type="button" aria-label="Keep going">▶️</button>
        <button id="stop" class="small-btn paused-stop" type="button">Stop this game</button>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
