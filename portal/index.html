<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Playroom</title>
    <meta
      name="description"
      content="Playroom is a cozy shelf of small web games for young children to play alone or with a grown-up."
    />
    <meta name="theme-color" content="#fff1d6" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>"
    />
  </head>
  <body>
    <header class="welcome">
      <h1 class="logo"><span class="logo-mark" aria-hidden="true">🧸</span> Playroom</h1>
      <p class="tagline">Pick a game to play!</p>
    </header>

    <main class="shelf">
      <div id="filters" class="filters"></div>
      <ul id="tiles" class="tiles"></ul>
      <div id="empty" class="empty" hidden>
        <p class="empty-note"><span aria-hidden="true">🙈</span> No games match all of those.</p>
        <button id="show-all" class="btn btn-sun" type="button">Show all games</button>
      </div>
    </main>

    <footer class="credits">
      Slovenian voice:
      <a href="https://huggingface.co/rhasspy/piper-voices/tree/main/sl/sl_SI/artur/medium">Piper “Artur”</a>,
      dataset by <a href="https://huggingface.co/datasets/ppisljar/artur_studio_tts/">ppisljar</a>,
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
